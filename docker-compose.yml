version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: employeemanagement-db
    environment:
      POSTGRES_DB: employeemanagement
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - employeemanagement-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: employeemanagement-backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/employeemanagement
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: password
      JWT_SECRET: mySecretKeyForJWTTokenGenerationAndValidation2023
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - employeemanagement-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: employeemanagement-frontend
    environment:
      REACT_APP_API_URL: http://localhost:8080/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - employeemanagement-network

volumes:
  postgres_data:

networks:
  employeemanagement-network:
    driver: bridge
