version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: employeemanagement-db
    environment:
      POSTGRES_DB: employeemanagement
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - employeemanagement-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: employeemanagement-backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/employeemanagement
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: password
      JWT_SECRET: mySecretKeyForJWTTokenGenerationAndValidation2024ChangeInProd
      JWT_EXPIRATION: 86400000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - employeemanagement-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: employeemanagement-frontend
    environment:
      REACT_APP_API_URL: http://localhost:8080/api
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - employeemanagement-network

volumes:
  postgres_data:

networks:
  employeemanagement-network:
    driver: bridge
