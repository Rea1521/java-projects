# Server Configuration
server.port=${PORT:8080}

# ===============================
# DATABASE CONFIGURATION
# ===============================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/employeemanagement}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# CONNECTION POOL (HikariCP)
# ===============================
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000

# ===============================
# JWT Configuration
# ===============================
app.jwtSecret=${JWT_SECRET:mySecretKeyForJWTTokenGenerationAndValidation2024ChangeInProductionEnvironmentNow!!}
app.jwtExpirationMs=${JWT_EXPIRATION:86400000}

# ===============================
# Circular References (Spring Boot 2.6+ requires explicit opt-in)
# ===============================
spring.main.allow-circular-references=true

# ===============================
# Logging
# ===============================
logging.level.org.springframework.security=INFO
logging.level.com.employeemanagement=DEBUG

# ===============================
# CORS
# ===============================
cors.allowed-origins=http://localhost:3000,http://localhost:5173

# ===============================
# Actuator (for Docker healthcheck)
# ===============================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never