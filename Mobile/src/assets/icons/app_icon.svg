<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="192" height="192" rx="40" ry="40" fill="url(#bg)" />

  <!-- Calendar body -->
  <rect x="36" y="54" width="120" height="104" rx="10" fill="white" opacity="0.95"/>

  <!-- Calendar header bar -->
  <rect x="36" y="54" width="120" height="32" rx="10" fill="#4F46E5"/>
  <rect x="36" y="72" width="120" height="14" fill="#4F46E5"/>

  <!-- Calendar binding pegs -->
  <rect x="65" y="42" width="12" height="26" rx="6" fill="white"/>
  <rect x="115" y="42" width="12" height="26" rx="6" fill="white"/>

  <!-- Month label dots -->
  <circle cx="70" cy="70" r="4" fill="white" opacity="0.7"/>
  <circle cx="96" cy="70" r="4" fill="white" opacity="0.7"/>
  <circle cx="122" cy="70" r="4" fill="white" opacity="0.7"/>

  <!-- Calendar grid dots (days) -->
  <rect x="52" y="102" width="10" height="10" rx="2" fill="#E0E7FF"/>
  <rect x="70" y="102" width="10" height="10" rx="2" fill="#E0E7FF"/>
  <rect x="88" y="102" width="10" height="10" rx="2" fill="#4F46E5"/>
  <rect x="106" y="102" width="10" height="10" rx="2" fill="#4F46E5"/>
  <rect x="124" y="102" width="10" height="10" rx="2" fill="#E0E7FF"/>

  <rect x="52" y="120" width="10" height="10" rx="2" fill="#E0E7FF"/>
  <rect x="70" y="120" width="10" height="10" rx="2" fill="#4F46E5"/>
  <rect x="88" y="120" width="10" height="10" rx="2" fill="#4F46E5"/>
  <rect x="106" y="120" width="10" height="10" rx="2" fill="#4F46E5"/>
  <rect x="124" y="120" width="10" height="10" rx="2" fill="#E0E7FF"/>

  <rect x="52" y="138" width="10" height="10" rx="2" fill="#E0E7FF"/>
  <rect x="70" y="138" width="10" height="10" rx="2" fill="#E0E7FF"/>
  <rect x="88" y="138" width="10" height="10" rx="2" fill="#E0E7FF"/>
  <rect x="106" y="138" width="10" height="10" rx="2" fill="#E0E7FF"/>
  <rect x="124" y="138" width="10" height="10" rx="2" fill="#E0E7FF"/>

  <!-- Green checkmark badge (approved leave indicator) -->
  <circle cx="148" cy="144" r="22" fill="url(#leaf)"/>
  <polyline points="138,144 145,152 159,136" stroke="white" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
